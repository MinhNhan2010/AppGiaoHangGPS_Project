<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="sphereBg" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDDFB"/>
    </radialGradient>
    <linearGradient id="vespaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B7DDD"/>
      <stop offset="55%" stop-color="#1F4E79"/>
      <stop offset="100%" stop-color="#0B2239"/>
    </linearGradient>
    <linearGradient id="expressBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="45%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#B84400"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0B2239" flood-opacity="0.32"/>
    </filter>
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="102" fill="url(#sphereBg)"/>

  <!-- Tuyến đường chữ S phát sáng Neon Cyan (#00B4D8) dưới mặt sàn Isometric -->
  <path d="M98,192 L176,144 Q198,128 178,108 L152,88 Q128,72 138,56" fill="none" stroke="#00B4D8" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <circle cx="98" cy="192" r="6" fill="#00F5D4" filter="url(#neonGlow)">
    <animateMotion path="M0,0 L78,-48 Q100,-64 80,-84 L54,-104" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Mô hình Xe tay ga 3D bo tròn mềm mại kèm chuyển động nhấp nhô -->
  <g filter="url(#softShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="1.1s" repeatCount="indefinite"/>
    <!-- Bánh xe trước & sau 3D -->
    <ellipse cx="82" cy="166" rx="22" ry="26" transform="rotate(-18 82 166)" fill="#1D2939"/>
    <ellipse cx="82" cy="166" rx="12" ry="15" transform="rotate(-18 82 166)" fill="#90E0EF"/>
    <ellipse cx="164" cy="130" rx="20" ry="24" transform="rotate(-18 164 130)" fill="#1D2939"/>
    <!-- Yếm trước & Thân bầu 3D uốn cong mượt -->
    <path d="M68,144 C64,116 74,90 92,84 C104,80 108,98 106,126 C116,136 130,130 134,112 C138,94 168,88 176,112 C180,126 164,142 136,148 C108,154 74,158 68,144 Z" fill="url(#vespaBody)"/>
    <!-- Yên da 3D bo tròn -->
    <path d="M118,98 C126,86 154,82 164,92 C168,98 158,110 138,114 C122,116 114,106 118,98 Z" fill="#263238"/>
    <!-- Thùng hàng Hỏa tốc Isometric bo góc mềm (#FF6B00) -->
    <path d="M142,48 L174,32 Q182,28 190,34 L206,46 Q212,52 210,62 L208,84 Q206,92 198,96 L172,108 Q164,112 156,106 L140,94 Q134,88 136,78 L138,56 Q138,50 142,48 Z" fill="url(#expressBox)"/>
    <!-- Đèn pha tròn & Chùm sáng Volumetric -->
    <circle cx="94" cy="84" r="10" fill="#FFF3B0" stroke="#1F4E79" stroke-width="3"/>
    <polygon points="88,88 32,108 48,136" fill="#FFF3B0" opacity="0.45" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="0.9s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
