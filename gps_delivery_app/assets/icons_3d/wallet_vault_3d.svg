<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="sphereBg4" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </radialGradient>
    <linearGradient id="leatherWallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B5B84"/>
      <stop offset="55%" stop-color="#163A5F"/>
      <stop offset="100%" stop-color="#0A1E36"/>
    </linearGradient>
    <linearGradient id="gold3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="45%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#C87D00"/>
    </linearGradient>
    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="55%" stop-color="#28A745"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="102" fill="url(#sphereBg4)"/>

  <!-- Cụm đồng xu Vàng 3D và tia sao lấp lánh -->
  <g filter="url(#goldGlow)">
    <ellipse cx="106" cy="70" rx="22" ry="24" transform="rotate(-15 106 70)" fill="url(#gold3d)" stroke="#FFF3B0" stroke-width="2">
      <animate attributeName="cy" values="72;62;72" dur="1.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="128" cy="84" rx="22" ry="24" transform="rotate(12 128 84)" fill="url(#gold3d)" stroke="#FFF3B0" stroke-width="2">
      <animate attributeName="cy" values="82;74;82" dur="1.6s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="84" cy="74" r="5" fill="#FFF3B0">
      <animate attributeName="opacity" values="0.2;1.0;0.2" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="136" cy="54" r="4" fill="#FFF3B0">
      <animate attributeName="opacity" values="1.0;0.2;1.0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ví da Ký quỹ 3D Isometric có viền vàng -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="1.6s" repeatCount="indefinite"/>
    <path d="M68,112 L148,76 Q160,70 162,84 L162,144 Q162,156 150,162 L82,194 Q68,200 68,184 Z" fill="url(#leatherWallet)" stroke="#FFD166" stroke-width="2.5"/>
    <!-- Quai cài da 3D -->
    <path d="M62,138 L98,124 Q108,120 108,132 L108,146 Q108,156 98,160 L62,174 Z" fill="#1E4976" stroke="#90E0EF" stroke-width="1.5"/>
  </g>

  <!-- Khiên Bảo mật Ngọc lục bảo & Ổ khóa Vàng 3D -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,3; 0,-5; 0,3" dur="1.5s" repeatCount="indefinite"/>
    <path d="M164,88 L196,94 Q198,142 164,168 Q132,146 134,100 Z" fill="url(#emeraldShield)" stroke="url(#gold3d)" stroke-width="5" stroke-linejoin="round"/>
    <rect x="150" y="118" width="28" height="24" rx="5" fill="url(#gold3d)"/>
    <path d="M156,118 L156,108 A8,8 0 0,1 172,108 L172,118" fill="none" stroke="url(#gold3d)" stroke-width="5"/>
  </g>
</svg>
