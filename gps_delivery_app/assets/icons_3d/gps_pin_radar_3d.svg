<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="sphereBg3" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </radialGradient>
    <linearGradient id="mapSlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8EEFE"/>
      <stop offset="60%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
    <radialGradient id="glossyPin" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>
    <filter id="pinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="102" fill="url(#sphereBg3)"/>

  <!-- Tấm bản đồ 3D Isometric bo góc dày -->
  <path d="M120,100 L208,144 Q216,148 208,154 L126,196 Q120,200 114,196 L32,154 Q24,148 32,144 Z" fill="url(#mapSlab)"/>

  <!-- Các vòng sóng Neon Cyan phát sáng đồng tâm trên mặt phẳng bản đồ -->
  <g transform="translate(120, 146) scale(1, 0.56)" filter="url(#pinGlow)">
    <circle r="32" fill="none" stroke="#00F5D4" stroke-width="5"/>
    <circle r="54" fill="none" stroke="#00F5D4" stroke-width="4" opacity="0.8"/>
    <circle r="20" fill="none" stroke="#FFFFFF" stroke-width="5">
      <animate attributeName="r" values="18;76" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Quạt quét Radar xoay 360 độ -->
    <g>
      <path d="M0,0 L74,0 A74,74 0 0,1 48,56 Z" fill="#00F5D4" opacity="0.45"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Khối Ghim Định vị GPS 3D bóng gương nhảy nhịp nhàng -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="1.3s" repeatCount="indefinite"/>
    <path d="M120,144 C88,106 76,84 76,66 A44,44 0 1,1 164,66 C164,84 152,106 120,144 Z" fill="url(#glossyPin)"/>
    <circle cx="120" cy="66" r="24" fill="#1F4E79" stroke="#FFB74D" stroke-width="3"/>
    <circle cx="120" cy="66" r="11" fill="#FF6B00" filter="url(#pinGlow)">
      <animate attributeName="r" values="9;13;9" dur="1.0s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
