<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="radarBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F8FCFF"/>
      <stop offset="55%" stop-color="#D8F3DC"/>
      <stop offset="100%" stop-color="#1F4E79"/>
    </radialGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44"/>
      <stop offset="55%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#B83B00"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="96" fill="url(#radarBg)" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Đĩa bản đồ Radar 3D -->
  <ellipse cx="120" cy="166" rx="78" ry="32" fill="#0A2540" stroke="#00B4D8" stroke-width="4"/>

  <!-- Vòng sóng xung kích Radar nở rộng từ tâm đĩa -->
  <ellipse cx="120" cy="166" rx="20" ry="8" fill="none" stroke="#00B4D8" stroke-width="3">
    <animate attributeName="rx" values="14;74" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="6;30" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.0" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Kim quét Radar xoay 360 độ -->
  <g transform="translate(120, 166) scale(1, 0.42)">
    <g>
      <path d="M0,0 L72,0 A72,72 0 0,1 50,50 Z" fill="#00B4D8" opacity="0.55"/>
      <line x1="0" y1="0" x2="72" y2="0" stroke="#56CFE1" stroke-width="5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ghim Định vị GPS 3D nhảy nhịp nhàng -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M120,154 C92,118 82,98 82,82 A38,38 0 1,1 158,82 C158,98 148,118 120,154 Z" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="120" cy="82" r="16" fill="#FFFFFF"/>
  </g>
</svg>
