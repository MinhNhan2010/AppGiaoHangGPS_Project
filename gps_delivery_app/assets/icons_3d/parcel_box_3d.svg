<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="parcelBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F8FCFF"/>
      <stop offset="55%" stop-color="#E6F2FF"/>
      <stop offset="100%" stop-color="#1F4E79"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="96" fill="url(#parcelBg)" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Bóng đổ 3D co giãn bên dưới kiện hàng -->
  <ellipse cx="116" cy="190" rx="52" ry="12" fill="#0A192F" opacity="0.35">
    <animate attributeName="rx" values="54;42;54" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.38;0.20;0.38" dur="1.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Kiện hàng Isometric 3D bay lơ lửng -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 4; 0 -10; 0 4" dur="1.8s" repeatCount="indefinite"/>
    <!-- Mặt đỉnh -->
    <polygon points="116,54 178,86 116,118 54,86" fill="#F6AD55"/>
    <!-- Mặt trái -->
    <polygon points="54,86 116,118 116,180 54,148" fill="#DD6B20"/>
    <!-- Mặt phải -->
    <polygon points="116,118 178,86 178,148 116,180" fill="#C05621"/>
    <!-- Băng keo niêm phong Cam (#FF6B00) -->
    <line x1="85" y1="70" x2="147" y2="102" stroke="#FF6B00" stroke-width="10" stroke-linecap="round"/>
    <!-- Mã vạch Barcode -->
    <g stroke="#FFFFFF" stroke-width="4">
      <line x1="70" y1="114" x2="70" y2="142"/>
      <line x1="80" y1="119" x2="80" y2="147"/>
      <line x1="90" y1="124" x2="90" y2="152"/>
      <line x1="100" y1="129" x2="100" y2="157"/>
    </g>
  </g>

  <!-- Chùm tia Laser Đỏ/Cam quét dọc lên xuống qua kiện hàng -->
  <line x1="44" y1="70" x2="188" y2="70" stroke="#FF2D55" stroke-width="6" stroke-linecap="round">
    <animate attributeName="y1" values="64;174;64" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="64;174;64" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Khiên Bảo Hiểm Xanh Lá (#28A745) lơ lửng lệch pha -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -4; 0 6; 0 -4" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="168" cy="154" r="30" fill="#28A745" stroke="#FFFFFF" stroke-width="4"/>
    <polyline points="154,154 164,164 182,144" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
